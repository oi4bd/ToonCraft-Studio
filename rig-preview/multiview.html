<!doctype html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ToonCraft Multi-View QA</title><style>body{background:#101827;color:#f5f6ff;font:15px system-ui;margin:0;padding:16px}h1{font-size:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.card{background:#1c293b;padding:10px;border:1px solid #3b4b60;border-radius:14px}.card canvas{width:100%;background:#fff;border-radius:9px}.card b{display:block;margin-bottom:8px}#status{background:#22344a;padding:12px;border-radius:10px}.good{color:#85f0a2}.bad{color:#ffa4a4}select{padding:10px;border-radius:8px;font:inherit}small{color:#c3cede}</style><h1>ToonCraft Multi-View Character QA</h1><p>Front, Left, Right, Back এবং ¾ View-এর প্রকৃত আলাদা Silhouette পরীক্ষা।</p><div id="status">Loading…</div><p><label>Action: <select id="action"></select></label></p><div class="grid" id="grid"></div><small>এটি পরীক্ষামূলক Rig; সম্পূর্ণ 3D Rotation বা Production Animation নয়।</small><script src="multiview.js"></script><script>
const lib=window.ToonCraftMultiView,check=[];const test=(name,ok)=>check.push('<div class="'+(ok?'good':'bad')+'">'+(ok?'PASS':'FAIL')+' — '+name+'</div>');
test('Rig loads',!!lib);if(lib){test('Six view definitions',lib.views.length===6);test('Left and right are opposite',lib.state('left','walk',1).direction===-lib.state('right','walk',1).direction);test('Back view is distinct',lib.state('back','idle',0).view==='back');test('Walk produces gait',lib.state('right','walk',.2).gait!==lib.state('right','walk',.6).gait);}
document.getElementById('status').innerHTML=check.join('');
if(lib){const select=document.getElementById('action');for(const a of lib.actions){const o=document.createElement('option');o.value=a;o.textContent=a;select.append(o)}select.value='walk';for(const view of lib.views){const box=document.createElement('div');box.className='card';const label=document.createElement('b');label.textContent=view;const canvas=document.createElement('canvas');canvas.width=300;canvas.height=450;box.append(label,canvas);document.getElementById('grid').append(box);const ctx=canvas.getContext('2d');function frame(){const t=performance.now()/1000;ctx.fillStyle='white';ctx.fillRect(0,0,300,450);ctx.beginPath();ctx.moveTo(0,413);ctx.lineTo(300,413);ctx.strokeStyle='#ddd';ctx.stroke();lib.draw(ctx,view,select.value,t,{x:150,y:405,scale:.88});requestAnimationFrame(frame)}frame()}}
</script></html>
