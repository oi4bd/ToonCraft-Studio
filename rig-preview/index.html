<!doctype html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ToonCraft Rig Visual QA</title><style>body{font:15px system-ui;background:#101827;color:white;margin:0;padding:16px}h1{font-size:21px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.tile{background:#1d2a3d;border:1px solid #3d4d62;border-radius:14px;padding:10px}.tile canvas{width:100%;aspect-ratio:9/16;background:white;border-radius:8px}.tile b{display:block;margin-bottom:7px}.ok{color:#7ef1a4}.bad{color:#ff9999}#results{white-space:pre-wrap;background:#202d42;padding:12px;border-radius:10px}small{color:#b3c3d5}</style><h1>ToonCraft — Expressive Rig Visual QA</h1><p>এই পেজ শুধু নতুন Rig পরীক্ষা করে; Live Studio পরিবর্তন করে না।</p><div id="results">Running checks…</div><div class="grid" id="grid"></div><script src="expressive-rig.js"></script><script>
const cases=[['Right / Walk',{movement:'ltr',action:'walk',seconds:4}],['Left / Walk',{movement:'rtl',action:'walk',seconds:4}],['Front / Talk',{movement:'still',facing:'front',action:'talk',seconds:4}],['Back / Walk',{movement:'away',action:'walk',seconds:4}],['Surprise',{movement:'still',action:'surprise',emotion:'surprised',seconds:4}],['Wave',{movement:'still',action:'wave',seconds:4}],['Jump',{movement:'still',action:'jump',seconds:4}],['Head opposite body',{movement:'ltr',facing:'right',head:'left',action:'walk',seconds:4}]];
const tests=[];function check(label,condition){tests.push({label,pass:!!condition})}
const rig=window.ToonCraftRig;
check('Rig loaded',!!rig&&typeof rig.draw==='function');
if(rig){const left=rig.pose({movement:'rtl',action:'walk',seconds:4},0),leftEnd=rig.pose({movement:'rtl',action:'walk',seconds:4},4);const right=rig.pose({movement:'ltr',action:'walk',seconds:4},0),rightEnd=rig.pose({movement:'ltr',action:'walk',seconds:4},4);check('RTL x decreases',left.x>leftEnd.x);check('LTR x increases',right.x<rightEnd.x);check('RTL faces left',left.face==='left');check('LTR faces right',right.face==='right');check('Explicit head direction preserved',rig.pose({movement:'ltr',head:'left',seconds:4},1).head==='left');check('Same time gives deterministic pose',JSON.stringify(rig.pose({movement:'ltr',action:'walk',seconds:4},1))===JSON.stringify(rig.pose({movement:'ltr',action:'walk',seconds:4},1)));check('Walking pose moves limbs',rig.pose({movement:'ltr',action:'walk',seconds:4},.2).step!==rig.pose({movement:'ltr',action:'walk',seconds:4},.5).step);}
document.getElementById('results').innerHTML=tests.map(x=>'<div class="'+(x.pass?'ok':'bad')+'">'+(x.pass?'PASS':'FAIL')+' — '+x.label+'</div>').join('');
if(rig)cases.forEach(([title,scene])=>{const tile=document.createElement('div');tile.className='tile';const label=document.createElement('b');label.textContent=title;const canvas=document.createElement('canvas');canvas.width=270;canvas.height=480;tile.append(label,canvas);document.getElementById('grid').append(tile);const ctx=canvas.getContext('2d');const draw=()=>{const t=(performance.now()/1000)%4;ctx.fillStyle='#fff';ctx.fillRect(0,0,270,480);ctx.save();ctx.scale(.5,.5);ctx.fillStyle='#eee';ctx.fillRect(0,750,540,210);rig.draw(ctx,scene,t,{style:'stick'});ctx.restore();requestAnimationFrame(draw)};draw()});
</script></html>
